# KILN_Mainsail's Moonraker part (Kiln OS includes it while the plugin is
# on): updates from Mainsail or Fluidd (Software Updates).

# Mainsail itself (root/install.sh downloads the first copy)
[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /data/ad5x/web/mainsail

# This plugin. After an update, RESTART Klipper: Kiln then runs
# root/update.sh by itself when root/ changed.
[update_manager mainsail-kiln]
type: git_repo
path: /data/ad5x/plugins/mainsail
origin: https://github.com/DIEHARDave/mainsail-kiln.git
primary_branch: main
is_system_service: False
